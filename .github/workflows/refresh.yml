name: Refresh schedule

# Every 2 hours at :23 past. Cron is UTC. Nothing downstream assumes an exact time, and the
# page shows the real "generated" stamp out of the file rather than an assumed cadence.
#
# ⚠ ASKED FOR EVERY 2 HOURS, EXPECT MORE LIKE 3 TO 4. GitHub delays scheduled runs under load
# and DROPS them outright, it does not queue them. Measured on the previous '0 */3 * * *'
# setting over three days: asked for 8 runs a day, got 4 to 5, with gaps of 2h36 up to 7h08
# and not one failed run. So the interval was halved to 2h to leave room for the drops, and
# moved off :00, which is the most congested minute on the platform because everyone writes
# it. Do NOT "fix" a long gap by shortening this further: the limit is GitHub's scheduler,
# not this number. The honest reading is always the generated stamp in schedule.json.
on:
  schedule:
    - cron: '23 */2 * * *'
  workflow_dispatch:        # run by hand right after a timetable change

concurrency:
  group: refresh-schedule
  cancel-in-progress: false

permissions:
  contents: write           # the job commits schedule.json back to this repo

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the Eversports feed
        env:
          # SECRET, set once with:
          #   gh secret set EVERSPORTS_ICS_TOKEN --repo <owner>/a37-schedule-feed
          # It is not in any file here and never reaches schedule.json or a log line.
          EVERSPORTS_ICS_TOKEN: ${{ secrets.EVERSPORTS_ICS_TOKEN }}
        run: python3 parse-ics.py > schedule.next.json

      - name: Check it, and decide whether anything changed
        id: check
        run: |
          set +e
          python3 check.py schedule.next.json schedule.json
          code=$?
          set -e
          if [ "$code" = "1" ]; then exit 1; fi
          echo "changed=$([ "$code" = "0" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"

      - name: Publish
        if: steps.check.outputs.changed == 'yes'
        run: |
          set -euo pipefail
          mv schedule.next.json schedule.json
          git config user.name  "a37-schedule-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schedule.json
          git commit -m "schedule: $(python3 -c 'import json;d=json.load(open("schedule.json"));print("%d classes, %s to %s" % (d["count"], d["from"], d["to"]))')"
          git push

      - name: Clean up
        if: always()
        run: rm -f schedule.next.json
