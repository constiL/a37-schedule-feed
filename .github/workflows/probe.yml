name: Probe feed horizon

# TEMPORARY, 2026-10-18. The owner published all of November but the feed stopped at 14 Nov.
# This asks the ICS endpoint seven different ways and prints how far each one reaches, so the
# four week horizon is MEASURED rather than assumed. It runs here, not on a laptop, because the
# token is a secret in this repo and gh cannot read secrets back.
# It prints only dates and counts. It never echoes the token. Delete once the answer is known.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the feed seven ways
        env:
          EVERSPORTS_ICS_TOKEN: ${{ secrets.EVERSPORTS_ICS_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, re, datetime, urllib.request, urllib.error
          tok = os.environ["EVERSPORTS_ICS_TOKEN"]
          BASE = "https://app.eversportsmanager.com/public/scheduler/ics"
          today = datetime.date.today()
          far   = today + datetime.timedelta(days=120)
          def dates(ics):
              ics = re.sub(r'\r?\n[ \t]', '', ics)
              return sorted(re.findall(r'^DTSTART[^:]*:(\d{8})', ics, re.M))
          attempts = [
              ("plain",            {}),
              ("from/to",          {"from": today.isoformat(), "to": far.isoformat()}),
              ("start/end",        {"start": today.isoformat(), "end": far.isoformat()}),
              ("dateFrom/dateTo",  {"dateFrom": today.isoformat(), "dateTo": far.isoformat()}),
              ("days=120",         {"days": "120"}),
              ("weeks=16",         {"weeks": "16"}),
              ("range=120",        {"range": "120"}),
              ("months=3",         {"months": "3"}),
          ]
          print("%-18s %8s  %-10s %-10s" % ("request", "events", "earliest", "latest"))
          print("-"*52)
          for label, extra in attempts:
              q = "?token=%s&scope=venue" % tok + "".join("&%s=%s" % kv for kv in extra.items())
              try:
                  with urllib.request.urlopen(urllib.request.Request(
                          BASE + q, headers={"User-Agent": "a37-probe"}), timeout=60) as r:
                      d = dates(r.read().decode("utf-8", "replace"))
              except urllib.error.HTTPError as e:
                  print("%-18s HTTP %s" % (label, e.code)); continue
              except Exception as e:
                  print("%-18s failed: %s" % (label, type(e).__name__)); continue
              if not d:
                  print("%-18s %8d" % (label, 0)); continue
              print("%-18s %8d  %-10s %-10s" % (label, len(d), d[0], d[-1]))
          PY
